
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seçiver - Uygulamayı İndir</title>
  <meta name="description" content="Seçiver ile karar vermek artık çok kolay!">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f5ef;
      color: #172b57;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 420px; width: 100%; }
    h1 { font-size: 42px; margin-bottom: 8px; }
    p { line-height: 1.6; }
    .button {
      display: block;
      background: #172b57;
      color: white;
      padding: 17px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      margin-top: 24px;
    }
    .hint { font-size: 14px; color: #667085; }
  </style>
</head>
<body>
  <main>
    <h1>Seçiver 🎯</h1>
    <p>Karar vermek artık çok kolay!</p>
    <p id="status">Uygulama mağazasına yönlendiriliyorsunuz...</p>
    <a id="download" class="button"
       href="https://play.google.com/store/apps/details?id=tr.com.mkemalyilmaz.seciver">
       Google Play'den İndir
    </a>
    <p class="hint">Otomatik yönlendirme gerçekleşmezse butona dokunun.</p>
  </main>

  <script>
    const android = /Android/i.test(navigator.userAgent);
    const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const playUrl = "https://play.google.com/store/apps/details?id=tr.com.mkemalyilmaz.seciver";
    const status = document.getElementById("status");
    const download = document.getElementById("download");

    if (android) {
      let seconds = 3;
      status.textContent = `${seconds} saniye sonra Google Play'e yönlendirileceksiniz...`;

      const countdown = setInterval(() => {
        seconds--;
        if (seconds > 0) {
          status.textContent = `${seconds} saniye sonra Google Play'e yönlendirileceksiniz...`;
        } else {
          clearInterval(countdown);
          status.textContent = "Google Play açılıyor...";
          const intentUrl =
  "intent://details?id=tr.com.mkemalyilmaz.seciver" +
  "#Intent;scheme=market;package=com.android.vending;" +
  "S.browser_fallback_url=" +
  encodeURIComponent(playUrl) +
  ";end";

window.location.href = intentUrl;
        }
      }, 1000);
    } else if (ios) {
      status.textContent = "Seçiver yakında App Store'da!";
      download.style.display = "none";
    } else {
      status.textContent = "Seçiver'i Android cihazınıza indirin.";
    }
  </script>
</body>
</html>
