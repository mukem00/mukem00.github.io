
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seçiver - Uygulamayı İndir</title>
  <meta name="description" content="Seçiver ile karar vermek artık çok kolay!">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #f8f5ef;
      color: #172b57;
      text-align: center;
      padding: 24px;
    }

    main {
      max-width: 420px;
      width: 100%;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 8px;
    }

    p {
      line-height: 1.6;
    }

    .button {
      display: block;
      background: #172b57;
      color: white;
      padding: 17px 24px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
      margin-top: 24px;
    }

    .button:active {
      opacity: 0.85;
    }

    .countdown {
      font-size: 15px;
      font-weight: 600;
      color: #172b57;
      margin-top: 18px;
    }

    .hint {
      font-size: 14px;
      color: #667085;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <main>
    <h1>Seçiver 🎯</h1>

    <p>Karar vermek artık çok kolay!</p>

    <p id="status">
      Uygulama mağazasına yönlendiriliyorsunuz...
    </p>

    <a
      id="download"
      class="button"
      href="https://play.google.com/store/apps/details?id=tr.com.mkemalyilmaz.seciver"
    >
      Google Play'den İndir
    </a>

    <p id="countdown" class="countdown" aria-live="polite">
      5 saniye sonra Google Play'e yönlendirileceksiniz...
    </p>

    <p class="hint">
      Otomatik yönlendirme gerçekleşmezse butona dokunun.
    </p>
  </main>

  <script>
    const android = /Android/i.test(navigator.userAgent);
    const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    const playUrl =
      "https://play.google.com/store/apps/details?id=tr.com.mkemalyilmaz.seciver";

    const status = document.getElementById("status");
    const download = document.getElementById("download");
    const countdown = document.getElementById("countdown");

    if (android) {
      status.textContent =
        "Seçiver'i Google Play'den indirebilirsiniz.";

      let seconds = 5;

      countdown.textContent =
        `${seconds} saniye sonra Google Play'e yönlendirileceksiniz...`;

      const timer = setInterval(() => {
        seconds--;

        if (seconds > 0) {
          countdown.textContent =
            `${seconds} saniye sonra Google Play'e yönlendirileceksiniz...`;
        } else {
          clearInterval(timer);

          countdown.textContent = "Google Play açılıyor...";

          window.location.replace(playUrl);
        }
      }, 1000);

    } else if (ios) {
      status.textContent = "Seçiver yakında App Store'da!";
      download.style.display = "none";
      countdown.style.display = "none";

    } else {
      status.textContent = "Seçiver'i Android cihazınıza indirin.";
      countdown.style.display = "none";
    }
  </script>
</body>
</html>
